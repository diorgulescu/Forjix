[package]
name = "forjix"
version = "0.1.0"
description = "Forjix — Offline 2D-to-3D Item Forging Desktop Studio"
authors = [
    "Dragoş Iorgulescu <32508790+diorgulescu@users.noreply.github.com>",
    "Antigravity (Google DeepMind) <antigravity@google.com>",
    "Mistral Vibe <vibe@mistral.ai>"
]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "forjix_lib"
crate-type = ["rlib"]

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.test]
debug = 0
strip = "debuginfo"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
