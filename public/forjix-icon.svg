<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Obsidian Forge Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#14192B" stroke="#FFD43B" stroke-width="3"/>
  <rect x="6" y="6" width="52" height="52" rx="10" fill="#1B233D"/>

  <!-- Glowing Forge Aura -->
  <circle cx="32" cy="34" r="18" fill="#FF7B1C" fill-opacity="0.16"/>

  <!-- Pixel Forge Sparks -->
  <rect x="14" y="14" width="4" height="4" fill="#FFE054"/>
  <rect x="47" y="12" width="4" height="4" fill="#38F2FF"/>
  <rect x="49" y="23" width="3" height="3" fill="#FF6B1A"/>
  <rect x="11" y="25" width="3" height="3" fill="#5CEEFF"/>

  <!-- Diagonal Wooden Hammer Handle -->
  <path d="M16 28L28 16L32 20L20 32L16 28Z" fill="#9A6230" stroke="#101422" stroke-width="2" stroke-linejoin="round"/>
