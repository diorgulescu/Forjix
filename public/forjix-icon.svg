  <rect x="28" y="38" width="8" height="2" fill="#FFE054"/>
  <!-- Anvil Waist & Heavy Base -->
  <path d="M23 46H41L43 50H48V55H16V50H21L23 46Z" fill="#8B9BB4" stroke="#101422" stroke-width="2.2" stroke-linejoin="round"/>
